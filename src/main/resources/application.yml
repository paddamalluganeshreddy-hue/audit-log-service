spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:h2:mem:auditlog;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
audit:
  retention-days: 365
  sensitive-payload-fields: password,ssn,token,secret
  # Set AUDIT_REDACTION_KEY to a unique secret outside source control in real deployments.
  redaction-key: ${AUDIT_REDACTION_KEY:development-only-change-me}
  max-payload-bytes: 65536
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
